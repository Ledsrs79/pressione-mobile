<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioLog Mobile</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icona.svg">
    <link rel="apple-touch-icon" href="icona.svg">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #1A202C;
            --bg-card: #2D3748;
            --text-main: #FFFFFF;
            --text-muted: #A0AEC0;
            --blue-accent: #3182CE;
            --green-accent: #38A169;
            --orange-accent: #DD6B20;
            --red-accent: #E53E3E;
            --gray-btn: #4A5568;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        h2 {
            font-size: 16px;
            color: var(--blue-accent);
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (min-width: 400px) {
            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 1;
        }
        
        @media (min-width: 400px) {
            .form-group.full-width {
                grid-column: span 2;
            }
        }

        label {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input, select {
            background-color: var(--bg-main);
            border: 1px solid var(--gray-btn);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            width: 100%;
        }

        input::placeholder {
            color: #55637a;
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background 0.2s;
        }

        button:last-child {
            margin-bottom: 0;
        }

        .btn-blue { background-color: var(--blue-accent); color: white; }
        .btn-gray { background-color: var(--gray-btn); color: white; }
        .btn-green { background-color: var(--green-accent); color: white; }
        .btn-orange { background-color: var(--orange-accent); color: white; }
        .btn-red-sm { background-color: var(--red-accent); color: white; padding: 4px 8px; font-size: 11px; border-radius: 4px; width: auto; margin: 0; }

        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--gray-btn);
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: bold;
            padding: 12px;
            font-size: 15px;
            border-bottom: 3px solid transparent;
            width: auto;
            margin-bottom: 0;
        }

        .tab-btn.active {
            color: var(--blue-accent);
            border-bottom: 3px solid var(--blue-accent);
        }

        .chart-container {
            position: relative;
            height: 260px;
            width: 100%;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 10px;
            box-sizing: border-box;
        }

        .modal-content {
            background-color: var(--bg-card);
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            max-width: 450px;
            max-height: 90vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .table-wrapper {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid var(--gray-btn);
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 10px 4px;
            text-align: center;
            border-bottom: 1px solid var(--gray-btn);
        }

        th { background-color: var(--bg-main); color: var(--text-muted); }
        
        .import-export-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Registrazione Valori</h2>
        <div class="form-grid">
            <div class="form-group">
                <label>Momento della giornata:</label>
                <select id="momento">
                    <option value="Mattina">Mattina</option>
                    <option value="Pranzo">Pranzo</option>
                    <option value="Sera">Sera</option>
                </select>
            </div>
            <div class="form-group">
                <label>Data e Ora Misurazione:</label>
                <input type="datetime-local" id="dataManuale">
            </div>
            <div class="form-group">
                <label>Pressione Max (Sistolica):</label>
                <input type="number" id="max" placeholder="es. 120">
            </div>
            <div class="form-group">
                <label>Pressione Min (Diastolica):</label>
                <input type="number" id="min" placeholder="es. 80">
            </div>
            <div class="form-group full-width">
                <label>Battiti Cardiaci (BPM):</label>
                <input type="number" id="bpm" placeholder="es. 70">
            </div>
        </div>
        <button type="button" class="btn-blue" onclick="salvaDati()">SALVA MISURAZIONE</button>
        <button type="button" class="btn-gray" onclick="apriModal()">Gestisci, Esporta e Importa Dati</button>
    </div>

    <div class="card">
        <label style="display:block; text-align:center; margin-bottom:12px; font-weight:bold; font-size:13px; letter-spacing: 0.5px;">VISUALIZZA ANDAMENTO DI:</label>
        <div class="tabs">
            <button type="button" class="tab-btn active" onclick="cambiaTab('Mattina')">Mattina</button>
            <button type="button" class="tab-btn" onclick="cambiaTab('Pranzo')">Pranzo</button>
            <button type="button" class="tab-btn" onclick="cambiaTab('Sera')">Sera</button>
        </div>
        <div class="chart-container">
            <canvas id="graficoPressione"></canvas>
        </div>
        <button type="button" class="btn-gray" onclick="condividiGrafico()" style="margin-top: 15px; margin-bottom: 0; background-color: #4A5568;">
            📱 CONDIVIDI GRAFICO (IMMAGINE)
        </button>
    </div>
</div>

<div id="modalModifica" class="modal">
    <div class="modal-content">
        <h2>Gestione Archivio</h2>
        
        <div class="import-export-grid">
            <button type="button" class="btn-green" onclick="esportaCSV()" style="margin-bottom:0; background-color: #2F855A;">⬇️ ESPORTA</button>
            <button type="button" class="btn-orange" onclick="document.getElementById('inputFile').click()" style="margin-bottom:0;">📤 IMPORTA</button>
        </div>
        <input type="file" id="inputFile" accept=".csv" style="display:none;" onchange="importaCSV(this)">
        
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Data/Ora</th>
                        <th>Mom.</th>
                        <th>Max</th>
                        <th>Min</th>
                        <th>BPM</th>
                        <th>Azione</th>
                    </tr>
                </thead>
                <tbody id="corpoTabella">
                </tbody>
            </table>
        </div>

        <div class="form-grid">
            <div class="form-group full-width">
                <label>Data e Ora della riga da cambiare:</label>
                <input type="text" id="targetData" placeholder="Scrivi es. 28/05 14:30">
            </div>
            <div class="form-group">
                <label>Nuova Max:</label>
                <input type="number" id="nMax" placeholder="es. 120">
            </div>
            <div class="form-group">
                <label>Nuova Min:</label>
                <input type="number" id="nMin" placeholder="es. 80">
            </div>
            <div class="form-group full-width">
                <label>Nuovi Battiti (BPM):</label>
                <input type="number" id="nBpm" placeholder="es. 72">
            </div>
        </div>
        <button type="button" class="btn-blue" onclick="eseguiModifica()">APPLICA MODIFICA</button>
        <button type="button" class="btn-gray" onclick="chiudiModal()">CHIUDI</button>
    </div>
</div>

<script>
    let mioGrafico = null;
    let tabCorrente = 'Mattina';

    document.addEventListener("DOMContentLoaded", () => {
        impostaDataAttuale();
        aggiornaGrafico();
    });

    function impostaDataAttuale() {
        let adesso = new Date();
        adesso.setMinutes(adesso.getMinutes() - adesso.getTimezoneOffset());
        document.getElementById('dataManuale').value = adesso.toISOString().slice(0,16);
    }

    function pulisciStringa(str) {
        return str ? str.toString().replace(/^\s+|\s+$/g, '') : '';
    }

    function ottieniDati() {
        let dati = localStorage.getItem("dati_pressione");
        return dati ? JSON.parse(dati) : [];
    }

    function salvaDati() {
        let momento = document.getElementById("momento").value;
        let max = pulisciStringa(document.getElementById("max").value);
        let min = pulisciStringa(document.getElementById("min").value);
        let bpm = pulisciStringa(document.getElementById("bpm").value);
        let dataScelta = document.getElementById("dataManuale").value;

        if(!max || !min || !bpm || !dataScelta) {
            alert("Tutti i campi devono essere compilati!");
            return;
        }

        let dataOggetto = new Date(dataScelta);
        let dataOra = dataOggetto.getDate().toString().padStart(2, '0') + '/' + 
                      (dataOggetto.getMonth()+1).toString().padStart(2, '0') + ' ' + 
                      dataOggetto.getHours().toString().padStart(2, '0') + ':' + 
                      dataOggetto.getMinutes().toString().padStart(2, '0');

        let nuovoDato = { data: dataOra, momento: momento, max: parseInt(max), min: parseInt(min), bpm: parseInt(bpm) };
        let archivio = ottieniDati();
        archivio.push(nuovoDato);
        localStorage.setItem("dati_pressione", JSON.stringify(archivio));

        document.getElementById("max").value = "";
        document.getElementById("min").value = "";
        document.getElementById("bpm").value = "";
        impostaDataAttuale();

        alert("Misurazione salvata correttamente!");
        aggiornaGrafico();
    }

    function cambiaTab(momento) {
        tabCorrente = momento;
        let bottoni = document.querySelectorAll(".tab-btn");
        bottoni.forEach(b => b.classList.remove("active"));
        if(event && event.target) event.target.classList.add("active");
        aggiornaGrafico();
    }

    function ordinaArchivio(archivio) {
        return archivio.sort((a, b) => {
            let [dataA, oraA] = a.data.split(" ");
            let [giornoA, meseA] = dataA.split("/");
            let [dataB, oraB] = b.data.split(" ");
            let [giornoB, meseB] = dataB.split("/");
            return new Date(2026, meseA-1, giornoA, oraA.split(":")[0], oraA.split(":")[1]) - 
                   new Date(2026, meseB-1, giornoB, oraB.split(":")[0], oraB.split(":")[1]);
        });
    }

    function aggiornaGrafico() {
        let archivio = ottieniDati();
        archivio = ordinaArchivio(archivio);

        let datiFiltrati = archivio.filter(d => d.momento === tabCorrente);

        let etichette = datiFiltrati.map(d => d.data.split(" ")[0]);
        let datasetMax = datiFiltrati.map(d => d.max);
        let datasetMin = datiFiltrati.map(d => d.min);

        let coloreMax = tabCorrente === 'Mattina' ? '#38BDF8' : (tabCorrente === 'Pranzo' ? '#F59E0B' : '#A855F7');
        let coloreMin = tabCorrente === 'Mattina' ? '#60A5FA' : (tabCorrente === 'Pranzo' ? '#FBBF24' : '#F472B6');

        if (mioGrafico) { mioGrafico.destroy(); }

        let ctx = document.getElementById('graficoPressione').getContext('2d');
        mioGrafico = new Chart(ctx, {
            type: 'line',
            data: {
                labels: etichette,
                datasets: [
                    { label: 'Max', data: datasetMax, borderColor: coloreMax, backgroundColor: coloreMax, tension: 0.2, borderWidth: 2.5 },
                    { label: 'Min', data: datasetMin, borderColor: coloreMin, backgroundColor: coloreMin, borderDash: [5, 5], tension: 0.2, borderWidth: 2 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { 
                    legend: { labels: { color: 'white', font: { size: 12 } } },
                    customCanvasBackgroundColor: { color: '#2D3748' }
                },
                scales: {
                    x: { ticks: { color: 'white' }, grid: { color: 'rgba(255,255,255,0.08)' } },
                    y: { ticks: { color: 'white' }, grid: { color: 'rgba(255,255,255,0.08)' } }
                }
            },
            plugins: [{
                id: 'customCanvasBackgroundColor',
                beforeDraw: (chart, args, options) => {
                    const {ctx} = chart;
                    ctx.save();
                    ctx.globalCompositeOperation = 'destination-over';
                    ctx.fillStyle = options.color || '#2D3748';
                    ctx.fillRect(0, 0, chart.width, chart.height);
                    ctx.restore();
                }
            }]
        });
    }

    function apriModal() {
        let archivio = ottieniDati();
        archivio = ordinaArchivio(archivio);
        let corpo = document.getElementById("corpoTabella");
        corpo.innerHTML = "";

        [...archivio].reverse().forEach(d => {
            let riga = `<tr>
                <td>${d.data}</td>
                <td>${d.momento.substring(0,3)}</td>
                <td>${d.max}</td>
                <td>${d.min}</td>
                <td>${d.bpm}</td>
                <td><button type="button" class="btn-red-sm" onclick="eliminaDato('${d.data}')">Elimina</button></td>
            </tr>`;
            corpo.innerHTML += riga;
        });

        document.getElementById("modalModifica").style.display = "flex";
    }

    function svuotaCampiModifica() {
        document.getElementById("targetData").value = "";
        document.getElementById("nMax").value = "";
        document.getElementById("nMin").value = "";
        document.getElementById("nBpm").value = "";
    }

    function chiudiModal() {
        document.getElementById("modalModifica").style.display = "none";
        svuotaCampiModifica();
    }

    function eliminaDato(dataTarget) {
        if(confirm("Sei sicuro di voler eliminare definitivamente la misurazione del " + dataTarget + "?")) {
            let archivio = ottieniDati();
            let nuovoArchivio = archivio.filter(d => d.data !== dataTarget);
            localStorage.setItem("dati_pressione", JSON.stringify(nuovoArchivio));
            alert("Misurazione eliminata!");
            apriModal();
            aggiornaGrafico();
        }
    }

    function eseguiModifica() {
        let target = pulisciStringa(document.getElementById("targetData").value);
        let nMax = document.getElementById("nMax").value;
        let nMin = document.getElementById("nMin").value;
        let nBpm = document.getElementById("nBpm").value;

        if(!target || !nMax || !nMin || !nBpm) {
            alert("Compila tutti i campi di modifica!");
            return;
        }

        let archivio = ottieniDati();
        let trovato = false;

        archivio.forEach(d => {
            if(d.data === target) {
                d.max = parseInt(nMax);
                d.min = parseInt(nMin);
                d.bpm = parseInt(nBpm);
                trovato = true;
            }
        });

        if(trovato) {
            localStorage.setItem("dati_pressione", JSON.stringify(archivio));
            alert("Dato storico corretto con successo!");
            svuotaCampiModifica();
            chiudiModal();
            aggiornaGrafico();
        } else {
            alert("Data e Ora non trovate. Controlla il formato.");
        }
    }

    function esportaCSV() {
        let archivio = ottieniDati();
        if(archivio.length === 0) {
            alert("Non ci sono dati da esportare!");
            return;
        }
        archivio = ordinaArchivio(archivio);
        let csvContent = "data:text/csv;charset=utf-8,Data/Ora,Momento,Pressione Max,Pressione Min,Battiti BPM\n";
        archivio.forEach(d => {
            csvContent += `"${d.data}","${d.momento}",${d.max},${d.min},${d.bpm}\n`;
        });
        let encodedUri = encodeURI(csvContent);
        let link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "CardioLog_Dati_Pressione.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function importaCSV(input) {
        let file = input.files[0];
        if (!file) return;

        let lettore = new FileReader();
        lettore.onload = function(e) {
            let testo = e.target.result;
            let righe = testo.split("\n");
            let archivioAttuale = ottieniDati();
            let contatoreImportati = 0;

            for(let i = 1; i < righe.length; i++) {
                let riga = righe[i].trim();
                if(!riga) continue;

                let campi = riga.split(",");
                if(campi.length < 5) continue;

                let data = campi[0].replace(/"/g, "");
                let momento = campi[1].replace(/"/g, "");
                let max = parseInt(campi[2]);
                let min = parseInt(campi[3]);
                let bpm = parseInt(campi[4]);

                let esisteGia = archivioAttuale.some(d => d.data === data);
                
                if(!esisteGia && data && momento && !isNaN(max)) {
                    archivioAttuale.push({ data: data, momento: momento, max: max, min: min, bpm: bpm });
                    contatoreImportati++;
                }
            }

            localStorage.setItem("dati_pressione", JSON.stringify(archivioAttuale));
            alert("Importazione completata!\nNuove misurazioni aggiunte: " + contatoreImportati);
            input.value = "";
            apriModal();
            aggiornaGrafico();
        };
        lettore.readAsText(file);
    }

    async function condividiGrafico() {
        let canvas = document.getElementById('graficoPressione');
        
        canvas.toBlob(async (blob) => {
            if (!blob) {
                alert("Errore nella generazione del grafico.");
                return;
            }
            
            let file = new File([blob], `CardioLog_${tabCorrente}.png`, { type: 'image/png' });
            
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: `Andamento Pressione - ${tabCorrente}`,
                        text: `Ecco il mio grafico della pressione (${tabCorrente}) generato con CardioLog.`
                    });
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        alert("Impossibile condividere il file.");
                    }
                }
            } else {
                let link = document.createElement('a');
                link.download = `CardioLog_${tabCorrente}.png`;
                link.href = canvas.toDataURL();
                link.click();
                alert("Condivisione nativa non supportata su questo browser. Il grafico è stato scaricato!");
            }
        }, 'image/png');
    }
</script>
</body>
</html>
